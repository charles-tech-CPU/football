spring:
  application:
    name: foot-results-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/foot_results
    username: ${DB_USER:foot_user}
    password: ${DB_PASSWORD:foot_password}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

# Port different de celui du projet LoL (8080) pour pouvoir faire tourner
# les deux backends en meme temps si besoin.
server:
  port: 8081

logging:
  level:
    com.charles.footresults: DEBUG

app:
  cors:
    # Liste de motifs separes par des virgules (ex: http://*:8180,https://*:8280).
    # Absente ou vide : Vite en LAN et acces HTTPS via Tailscale (WebConfig.DEFAULT_ALLOWED_ORIGINS).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
