spring:
  application:
    name: foot-results-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/foot_results
    username: ${DB_USER:foot_user}
    password: ${DB_PASSWORD:foot_password}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

# Port different de celui du projet LoL (8080) pour pouvoir faire tourner
# les deux backends en meme temps si besoin.
server:
  port: 8081

logging:
  level:
    com.charles.footresults: DEBUG
